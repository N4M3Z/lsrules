# Optional local hooks. Setup does not activate them.
repos:
  - repo: local
    hooks:
      - id: package-validation
        name: offline package validation and tests
        entry: make validate
        language: system
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: staged secret scan
        entry: gitleaks git --staged --pre-commit --no-banner
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
