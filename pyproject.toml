# Lint configuration only. The validators use the Python standard library.
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
extend-exclude = ["private", ".git", ".jj"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# Long policy expressions and synthetic fixtures retain their reviewed form.
ignore = ["E501"]
