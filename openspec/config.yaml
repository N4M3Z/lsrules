schema: spec-driven

context: |
  Write artifacts in English and use simple technical prose.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  lsrules contains portable Little Snitch policy references and agent review procedures.
  The current package uses Python 3.11 or later and standard-library offline validators.
  It contains profile design metadata, a blocklist catalog, and a disabled global focus example.
  The existing checker does not parse native snapshots or prove effective rule coverage.
  Shared guidance lives in AGENTS.md and .agents/rules/.
  Three existing skills cover audits, source review, and release preparation.
  The canonical Daybreak contract has a separate native Codex adapter.
  Adapter configuration alone does not prove runtime dispatch or sandbox enforcement.
  Native rules, portable policy, GUI observations, runtime tests, and inferred state are distinct evidence types.
  Unapproved is a review annotation. A disabled rule is different from an enabled rule in an inactive profile.
  Profiles use their own rules plus all-profile rules. Remote rule groups have global scope.
  Prefer stable verified vendor identities. Scope unchecked helper exceptions explicitly.
  Changing endpoints or low use counts alone do not prove that a rule is obsolete.
  Native outgoing port conditions match remote ports, not local source ports.
  Keep private backups, machine identities, account data, addresses, and network labels outside this repository.
  Preserve required ChatGPT access and existing approval scope.
  This project does not automatically change host settings, create backups, restore models, or run network probes.
  Exact commits, GitHub repository creation, and pushes require explicit user approval.

rules:
  proposal:
    - Explain the user outcome and distinguish current behavior from proposed behavior.
    - Name bounded capabilities and state exclusions without inventing native Little Snitch support.
  specs:
    - Write observable SHALL requirements with concrete success and failure scenarios.
    - Include evidence limits, scope preservation, and privacy scenarios when they affect the capability.
    - Keep proposed requirements in change specs until implementation and verification permit archive.
  design:
    - Explain identity, profile, rule precedence, and evidence decisions that affect correctness.
    - Include an independent Daybreak review and record unresolved findings without calling them verified.
    - Resolve questions that change acceptance criteria before writing implementation tasks.
  tasks:
    - Keep implementation tasks unchecked until the work and its verification are complete.
    - Map material risks to meaningful synthetic tests and an independent adversarial review.
    - Separate offline validation, native acceptance, runtime tests, and publication steps.

operations:
  apply:
    guidance:
      - Follow the approved change scope and preserve unrelated work.
      - Report local changes, test evidence, host changes, and publication state separately.
  archive:
    guidance:
      - Archive only implemented and verified requirements.
      - Retain unresolved verification limits in the final report.
